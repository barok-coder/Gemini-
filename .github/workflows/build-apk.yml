name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Cordova
      run: npm install -g cordova

    - name: Build Cordova Android APK
      run: |
        cordova create app com.barokcoder.geminichat GeminiChat
        cp index.html app/www/index.html
        cp config.xml app/config.xml
        cd app
        cordova platform add android
        cordova build android --debug --no-telemetry

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GeminiChat-APK
        path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
