name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Cordova
      run: npm install -g cordova

    - name: Create Cordova Project & Build
      run: |
        cordova create build_app com.barokcoder.geminilite GeminiLite
        cp index.html build_app/www/index.html
        cp config.xml build_app/config.xml
        cd build_app
        cordova platform add android
        cordova build android --debug --no-telemetry

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: gemini-lite-apk
        path: build_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
