name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java JDK
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Cordova & Image Tools
      run: |
        npm install -g cordova
        sudo apt-get update && sudo apt-get install -y imagemagick

    - name: Generate Gemini App Icon & Build APK
      run: |
        cordova create app com.barokcoder.geminichat GeminiChat
        cp index.html app/www/index.html
        cp config.xml app/config.xml
        
        # Generate official Gemini Spark SVG Icon
        cat << 'EOF' > gemini_icon.svg
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
          <rect width="512" height="512" rx="100" fill="#131314"/>
          <path d="M256 64C256 169.9 169.9 256 64 256C169.9 256 256 342.1 256 448C256 342.1 342.1 256 448 256C342.1 256 256 169.9 256 64Z" fill="url(#geminiGradient)"/>
          <defs>
            <linearGradient id="geminiGradient" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#4285F4"/>
              <stop offset="50%" stop-color="#9B51E0"/>
              <stop offset="100%" stop-color="#E91E63"/>
            </linearGradient>
          </defs>
        </svg>
        EOF

        # Convert SVG to standard Android launcher PNG icons
        convert -background none -resize 512x512 gemini_icon.svg app/www/icon.png

        cd app
        cordova platform add android
        cordova build android --debug --no-telemetry

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GeminiChat-APK
        path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
