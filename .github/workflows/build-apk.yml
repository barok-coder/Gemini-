name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Cordova
      run: npm install -g cordova@12.0.0

    - name: Accept Android SDK Licenses & Install Tools
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.2" "platforms;android-33"

    - name: Build Cordova Android APK
      env:
        JAVA_HOME: ${{ env.JAVA_HOME }}
        CORDOVA_JAVA_HOME: ${{ env.JAVA_HOME }}
        GRADLE_OPTS: "-Dorg.gradle.daemon=false"
      run: |
        rm -rf app
        cordova create app com.barokcoder.geminichat GeminiChat
        
        cat << 'EOF' > app/config.xml
        <?xml version='1.0' encoding='utf-8'?>
        <widget id="com.barokcoder.geminichat" version="1.0.0" xmlns="http://www.cordova.io/ns/1.0">
            <name>Gemini</name>
            <description>Gemini Web Client</description>
            <author email="dev@example.com">Barok Coder</author>
            <content src="index.html" />
            <access origin="*" />
            <allow-intent href="http://*/*" />
            <allow-intent href="https://*/*" />
        </widget>
        EOF

        cp index.html app/www/index.html

        cd app
        cordova platform add android@12.0.0 --save
        cordova build android --debug --no-telemetry

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GeminiChat-APK
        path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
