<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lite Gemini App</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #121212; color: #e0e0e0; display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
    
    header { background: #1e1e1e; padding: 10px 12px; border-bottom: 1px solid #333; display: flex; gap: 8px; align-items: center; }
    header input { flex: 1; padding: 8px 12px; border-radius: 6px; border: 1px solid #444; background: #2a2a2a; color: #fff; font-size: 13px; outline: none; }
    header button { padding: 8px 12px; border-radius: 6px; border: none; background: #333; color: #aaa; font-size: 12px; cursor: pointer; }

    #chat-box { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    
    .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; line-height: 1.45; font-size: 14px; word-break: break-word; white-space: pre-wrap; }
    .user { background: #005c4b; color: #e9edef; align-self: flex-end; border-bottom-right-radius: 2px; }
    .bot { background: #202c33; color: #e9edef; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #2a3942; }
    .system { background: transparent; color: #8696a0; font-size: 12px; text-align: center; align-self: center; border: none; }

    footer { padding: 8px 12px; background: #1e1e1e; display: flex; gap: 8px; border-top: 1px solid #333; align-items: center; }
    footer textarea { flex: 1; padding: 10px 12px; border-radius: 18px; border: 1px solid #444; background: #2a2a2a; color: #fff; outline: none; font-size: 14px; resize: none; height: 40px; line-height: 20px; }
    footer button { padding: 10px 16px; border-radius: 18px; border: none; background: #00a884; color: #fff; font-weight: bold; cursor: pointer; height: 40px; }
    footer button:disabled { background: #333; color: #666; }
  </style>
</head>
<body>

  <header>
    <input type="password" id="api-key" placeholder="Paste Gemini API Key here" onchange="saveApiKey()" />
    <button onclick="toggleKeyVisibility()" id="show-btn">Show</button>
  </header>

  <div id="chat-box">
    <div class="msg system">Lite Gemini initialized. Enter your API key above to start.</div>
  </div>

  <footer>
    <textarea id="user-input" placeholder="Type a message..." rows="1" onkeydown="handleKeyPress(event)"></textarea>
    <button id="send-btn" onclick="sendMessage()">Send</button>
  </footer>

  <script>
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');
    const apiKeyInput = document.getElementById('api-key');
    const sendBtn = document.getElementById('send-btn');
    const showBtn = document.getElementById('show-btn');

    // Auto-load saved key on launch
    window.onload = () => {
      const savedKey = localStorage.getItem('gemini_api_key');
      if (savedKey) {
        apiKeyInput.value = savedKey;
      }
    };

    function saveApiKey() {
      localStorage.setItem('gemini_api_key', apiKeyInput.value.trim());
    }

    function toggleKeyVisibility() {
      if (apiKeyInput.type === "password") {
        apiKeyInput.type = "text";
        showBtn.innerText = "Hide";
      } else {
        apiKeyInput.type = "password";
        showBtn.innerText = "Show";
      }
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    let conversationHistory = [];

    async function sendMessage() {
      const prompt = userInput.value.trim();
      const apiKey = apiKeyInput.value.trim();

      if (!prompt) return;
      if (!apiKey) {
        alert("Please enter and save your Gemini API key in the top bar.");
        return;
      }

      // Save key automatically when sending a message
      saveApiKey();

      appendMessage(prompt, 'user');
      userInput.value = '';
      sendBtn.disabled = true;

      conversationHistory.push({ role: "user", parts: [{ text: prompt }] });

      // Keep only last 6 turns to save RAM
      if (conversationHistory.length > 6) {
        conversationHistory = conversationHistory.slice(-6);
      }

      const botMsgElement = appendMessage('Thinking...', 'bot');

      try {
        const response = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`,
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: conversationHistory })
          }
        );

        const data = await response.json();

        if (data.error) {
          botMsgElement.innerText = "API Error: " + data.error.message;
        } else if (data.candidates && data.candidates[0].content) {
          const botReply = data.candidates[0].content.parts[0].text;
          botMsgElement.innerText = botReply;

          conversationHistory.push({ role: "model", parts: [{ text: botReply }] });
        } else {
          botMsgElement.innerText = "No response generated. Try again.";
        }
      } catch (err) {
        botMsgElement.innerText = "Network Error. Check your connection or API Key.";
      } finally {
        sendBtn.disabled = false;
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    }

    function appendMessage(text, type) {
      const msg = document.createElement('div');
      msg.className = `msg ${type}`;
      msg.innerText = text;
      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
      return msg;
    }
  </script>
</body>
  </html>
