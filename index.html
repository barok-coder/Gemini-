<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gemini</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #131314; color: #e3e3e3; display: flex; height: 100vh; height: 100dvh; overflow: hidden; }

    /* --- Sidebar Drawer --- */
    #sidebar {
      position: fixed; top: 0; left: -280px; width: 280px; height: 100%;
      background: #1e1f20; z-index: 1000; transition: left 0.25s ease-in-out;
      display: flex; flex-direction: column; padding: 16px; border-right: 1px solid #2d2e31;
    }
    #sidebar.open { left: 0; }
    #overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.5); z-index: 999; display: none;
    }
    #overlay.active { display: block; }

    .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .new-chat-btn {
      display: flex; align-items: center; justify-content: flex-start; gap: 10px; background: #131314; color: #e3e3e3;
      border: 1px solid #3c4043; padding: 12px 16px; border-radius: 28px; font-size: 14px; font-weight: 500; cursor: pointer; width: 100%; margin-bottom: 20px;
    }
    .history-title { font-size: 12px; color: #8e918f; font-weight: 600; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
    .history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
    .history-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 12px; border-radius: 20px; font-size: 14px; color: #c4c7c5; cursor: pointer;
    }
    .history-item:hover, .history-item.active { background: #2d2e31; color: #fff; }
    .history-item .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
    .history-item .del-btn { background: none; border: none; color: #8e918f; font-size: 14px; cursor: pointer; margin-left: 8px; }

    /* --- App Container --- */
    #app-container { flex: 1; display: flex; flex-direction: column; width: 100%; height: 100%; position: relative; }

    header {
      background: #131314; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid #1e1f20; z-index: 10;
    }
    .left-header { display: flex; align-items: center; gap: 12px; }
    .icon-btn { background: none; border: none; color: #e3e3e3; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .brand-title { font-size: 18px; font-weight: 600; background: linear-gradient(90deg, #4285f4, #9b51e0, #e91e63); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    /* --- Key Input Drawer --- */
    #key-drawer {
      background: #1e1f20; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px;
      border-bottom: 1px solid #2d2e31;
    }
    .key-input-group { display: flex; gap: 8px; }
    .key-input-group input {
      flex: 1; padding: 8px 12px; border-radius: 8px; border: 1px solid #3d3e41;
      background: #131314; color: #fff; font-size: 13px; outline: none;
    }
    .save-btn { background: #a8c7fa; color: #040e15; border: none; padding: 0 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }

    /* --- Chat Area & Intro --- */
    #chat-box { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }

    #intro-screen {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100%; text-align: center; color: #c4c7c5; gap: 16px; padding: 20px;
    }
    .gemini-spark-icon { width: 64px; height: 64px; animation: pulse 3s infinite ease-in-out; }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.08); opacity: 1; }
      100% { transform: scale(1); opacity: 0.9; }
    }
    .intro-text { font-size: 22px; font-weight: 500; background: linear-gradient(90deg, #4285f4, #9b51e0, #e91e63); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .msg { max-width: 88%; padding: 12px 16px; border-radius: 18px; line-height: 1.5; font-size: 14px; word-break: break-word; }
    .user { background: #2b2c2e; color: #e3e3e3; align-self: flex-end; border-bottom-right-radius: 4px; }
    .bot { background: transparent; color: #e3e3e3; align-self: flex-start; width: 100%; max-width: 100%; padding-left: 0; }
    
    .bot p { margin-bottom: 8px; }
    .bot code { background: #1e1f20; padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 13px; color: #a8c7fa; }
    .bot pre { background: #1e1f20; padding: 12px; border-radius: 8px; overflow-x: auto; margin: 8px 0; border: 1px solid #2d2e31; }

    /* --- Multiple File Preview Bar --- */
    #preview-bar { display: none; background: #1e1f20; padding: 8px 16px; overflow-x: auto; gap: 10px; border-top: 1px solid #2d2e31; }
    .preview-pill {
      display: flex; align-items: center; gap: 6px; background: #2b2c2e; color: #a8c7fa;
      padding: 4px 10px; border-radius: 16px; font-size: 12px; white-space: nowrap;
    }
    .preview-pill button { background: none; border: none; color: #ff6b6b; font-weight: bold; cursor: pointer; margin-left: 4px; }

    /* --- Input Area --- */
    footer { padding: 12px 16px; background: #131314; display: flex; gap: 8px; align-items: center; }
    .input-wrapper { flex: 1; display: flex; align-items: center; background: #1e1f20; border-radius: 24px; padding: 4px 14px; border: 1px solid #2d2e31; }
    .input-wrapper textarea { flex: 1; background: transparent; border: none; color: #fff; outline: none; font-size: 14px; resize: none; height: 36px; line-height: 20px; padding: 8px 0; }
    
    .attach-btn { color: #c4c7c5; font-size: 20px; cursor: pointer; margin-right: 8px; }
    .send-btn { background: #a8c7fa; color: #040e15; border: none; border-radius: 50%; width: 36px; height: 36px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .send-btn:disabled { background: #2b2c2e; color: #8e918f; }
  </style>
</head>
<body>

  <div id="overlay" onclick="toggleSidebar()"></div>

  <!-- Sidebar Drawer -->
  <div id="sidebar">
    <div class="sidebar-header">
      <span style="font-weight: bold; color: #a8c7fa; font-size: 16px;">Chats</span>
      <button class="icon-btn" onclick="toggleSidebar()">✕</button>
    </div>
    <button class="new-chat-btn" onclick="createNewChatSession()">+ New chat</button>
    <div class="history-title">Recent</div>
    <div class="history-list" id="history-list"></div>
  </div>

  <div id="app-container">
    <header>
      <div class="left-header">
        <button class="icon-btn" onclick="toggleSidebar()">☰</button>
        <div class="brand-title">Gemini</div>
      </div>
    </header>

    <!-- Key Container -->
    <div id="key-drawer">
      <div class="key-input-group">
        <input type="password" id="gemini-key" placeholder="Enter Gemini API Key..." />
        <button class="save-btn" onclick="saveKey()">Save</button>
      </div>
    </div>

    <!-- Main Chat Window -->
    <div id="chat-box"></div>

    <!-- File Attachments Preview Container -->
    <div id="preview-bar"></div>

    <footer>
      <div class="input-wrapper">
        <label class="attach-btn" for="file-input">+</label>
        <input type="file" id="file-input" style="display: none;" accept="image/*,application/pdf,text/*" multiple onchange="handleMultipleFiles(event)" />
        <textarea id="user-input" placeholder="Message Gemini..." rows="1" onkeydown="handleKeyPress(event)"></textarea>
      </div>
      <button class="send-btn" id="send-btn" onclick="sendMessage()">➤</button>
    </footer>
  </div>

  <script>
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const previewBar = document.getElementById('preview-bar');
    const keyDrawer = document.getElementById('key-drawer');
    const historyList = document.getElementById('history-list');
    
    let currentAttachments = [];
    let db = null;
    let activeSessionId = null;

    // --- IndexedDB Configuration ---
    const request = indexedDB.open("GeminiAppDB", 3);
    request.onupgradeneeded = (e) => {
      db = e.target.result;
      if (!db.objectStoreNames.contains("sessions")) {
        db.createObjectStore("sessions", { keyPath: "id" });
      }
    };
    request.onsuccess = (e) => {
      db = e.target.result;
      initAppSessions();
    };

    window.onload = () => {
      const gKey = localStorage.getItem('gemini_key') || '';
      if (gKey) {
        document.getElementById('gemini-key').value = gKey;
        keyDrawer.style.display = 'none';
      }
    };

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('overlay').classList.toggle('active');
    }

    function saveKey() {
      const val = document.getElementById('gemini-key').value.trim();
      if (!val) return alert("Enter a valid key");
      localStorage.setItem('gemini_key', val);
      keyDrawer.style.display = 'none';
    }

    function getApiKey() {
      return localStorage.getItem('gemini_key') || document.getElementById('gemini-key').value.trim();
    }

    function renderIntroScreen() {
      chatBox.innerHTML = `
        <div id="intro-screen">
          <svg class="gemini-spark-icon" viewBox="0 0 512 512">
            <path d="M256 64C256 169.9 169.9 256 64 256C169.9 256 256 342.1 256 448C256 342.1 342.1 256 448 256C342.1 256 256 169.9 256 64Z" fill="url(#geminiGradient)"/>
            <defs>
              <linearGradient id="geminiGradient" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#4285F4"/>
                <stop offset="50%" stop-color="#9B51E0"/>
                <stop offset="100%" stop-color="#E91E63"/>
              </linearGradient>
            </defs>
          </svg>
          <div class="intro-text">Hello, how can I help today?</div>
        </div>
      `;
    }

    // --- Session & History Logic ---
    async function initAppSessions() {
      const sessions = await getAllSessions();
      if (sessions.length === 0) {
        await createNewChatSession();
      } else {
        switchSession(sessions[0].id);
      }
      renderSidebarSessions();
    }

    async function createNewChatSession() {
      const newId = "session_" + Date.now();
      const newSession = { id: newId, title: "New Chat", messages: [], timestamp: Date.now() };
      
      const tx = db.transaction("sessions", "readwrite");
      await tx.objectStore("sessions").put(newSession);
      
      activeSessionId = newId;
      renderIntroScreen();
      await renderSidebarSessions();
      if (document.getElementById('sidebar').classList.contains('open')) {
        toggleSidebar();
      }
    }

    function getAllSessions() {
      return new Promise((resolve) => {
        const tx = db.transaction("sessions", "readonly");
        const req = tx.objectStore("sessions").getAll();
        req.onsuccess = () => {
          const list = req.result || [];
          list.sort((a,b) => b.timestamp - a.timestamp);
          resolve(list);
        };
      });
    }

    async function switchSession(id) {
      activeSessionId = id;
      chatBox.innerHTML = '';
      const tx = db.transaction("sessions", "readonly");
      const req = tx.objectStore("sessions").get(id);
      req.onsuccess = () => {
        const session = req.result;
        if (session && session.messages && session.messages.length > 0) {
          session.messages.forEach(m => appendMessage(m.text, m.role));
        } else {
          renderIntroScreen();
        }
      };
      renderSidebarSessions();
    }

    async function deleteSession(e, id) {
      e.stopPropagation();
      const tx = db.transaction("sessions", "readwrite");
      await tx.objectStore("sessions").delete(id);
      const remaining = await getAllSessions();
      if (remaining.length === 0) {
        await createNewChatSession();
      } else if (activeSessionId === id) {
        switchSession(remaining[0].id);
      } else {
        renderSidebarSessions();
      }
    }

    async function renderSidebarSessions() {
      const sessions = await getAllSessions();
      historyList.innerHTML = '';
      sessions.forEach(s => {
        const item = document.createElement('div');
        item.className = `history-item ${s.id === activeSessionId ? 'active' : ''}`;
        item.onclick = () => { switchSession(s.id); toggleSidebar(); };

        const titleSpan = document.createElement('span');
        titleSpan.className = 'title';
        titleSpan.innerText = s.title;

        const delBtn = document.createElement('button');
        delBtn.className = 'del-btn';
        delBtn.innerText = '✕';
        delBtn.onclick = (e) => deleteSession(e, s.id);

        item.appendChild(titleSpan);
        item.appendChild(delBtn);
        historyList.appendChild(item);
      });
    }

    async function appendMessageToSession(role, text) {
      if (!activeSessionId) return;
      const tx = db.transaction("sessions", "readwrite");
      const store = tx.objectStore("sessions");
      const req = store.get(activeSessionId);
      
      req.onsuccess = () => {
        const session = req.result;
        if (!session) return;
        
        session.messages.push({ role, text, timestamp: Date.now() });
        if (session.messages.length === 1 && role === 'user') {
          session.title = text.slice(0, 30) + (text.length > 30 ? '...' : '');
        }
        session.timestamp = Date.now();
        store.put(session);
        renderSidebarSessions();
      };
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    // --- Multiple File Handler ---
    function handleMultipleFiles(event) {
      const files = Array.from(event.target.files);
      if (!files.length) return;

      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = function(e) {
          const base64Data = e.target.result.split(',')[1];
          currentAttachments.push({
            name: file.name,
            mimeType: file.type || "application/octet-stream",
            data: base64Data
          });
          renderPreviewBar();
        };
        reader.readAsDataURL(file);
      });
      document.getElementById('file-input').value = '';
    }

    function removeAttachment(index) {
      currentAttachments.splice(index, 1);
      renderPreviewBar();
    }

    function renderPreviewBar() {
      if (currentAttachments.length === 0) {
        previewBar.style.display = 'none';
        previewBar.innerHTML = '';
        return;
      }
      previewBar.style.display = 'flex';
      previewBar.innerHTML = '';
      currentAttachments.forEach((att, idx) => {
        const pill = document.createElement('div');
        pill.className = 'preview-pill';
        pill.innerHTML = `<span>📎 ${att.name}</span><button onclick="removeAttachment(${idx})">✕</button>`;
        previewBar.appendChild(pill);
      });
    }

    function clearAttachments() {
      currentAttachments = [];
      renderPreviewBar();
    }

    // --- Resilient Fetch with Exponential Backoff ---
    async function fetchWithRetry(url, options, maxRetries = 3) {
      let delay = 2000;
      for (let attempt = 0; attempt < maxRetries; attempt++) {
        const res = await fetch(url, options);
        if (res.ok) return await res.json();
        
        const data = await res.json().catch(() => ({}));
        
        // Retry on 503 Service Unavailable or 429 Too Many Requests/Overload
        if ((res.status === 503 || res.status === 429) && attempt < maxRetries - 1) {
          await new Promise(r => setTimeout(r, delay));
          delay *= 2; // 2s -> 4s -> 8s
          continue;
        }
        
        throw new Error((data.error && data.error.message) || `HTTP Error ${res.status}`);
      }
    }

    async function sendMessage() {
      const prompt = userInput.value.trim();
      const apiKey = getApiKey();

      if (!prompt && currentAttachments.length === 0) return;

      if (!apiKey) {
        keyDrawer.style.display = 'flex';
        alert("Please set your Gemini API key.");
        return;
      }

      // Hide intro screen on first prompt
      const introScreen = document.getElementById('intro-screen');
      if (introScreen) introScreen.remove();

      let displayPrompt = prompt;
      if (currentAttachments.length > 0) {
        displayPrompt += `\n[Attached ${currentAttachments.length} file(s)]`;
      }

      appendMessage(displayPrompt, 'user');
      await appendMessageToSession("user", displayPrompt);

      userInput.value = '';
      const attachmentsToSend = [...currentAttachments];
      clearAttachments();
      sendBtn.disabled = true;

      const botMsgElement = appendMessage('...', 'bot');

      try {
        let parts = [];
        attachmentsToSend.forEach(att => {
          parts.push({ inlineData: { mimeType: att.mimeType, data: att.data } });
        });
        if (prompt) parts.push({ text: prompt });

        const data = await fetchWithRetry(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`,
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts }] })
          }
        );

        const botReply = data.candidates[0].content.parts[0].text;
        botMsgElement.innerHTML = marked.parse(botReply);
        await appendMessageToSession("bot", botReply);
      } catch (err) {
        botMsgElement.innerText = "Error: " + err.message;
      } finally {
        sendBtn.disabled = false;
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    }

    function appendMessage(text, type) {
      const msg = document.createElement('div');
      msg.className = `msg ${type}`;
      if (type === 'user') {
        msg.innerText = text;
      } else {
        msg.innerHTML = marked.parse(text);
      }
      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
      return msg;
    }
  </script>
</body>
  </html>
