<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>gemini</title>
  <!-- Lightweight Markdown Parser for authentic response formatting -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #131314; color: #e3e3e3; display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
    
    header { background: #1e1f20; padding: 10px 14px; border-bottom: 1px solid #2e2f31; display: flex; gap: 8px; align-items: center; justify-content: space-between; }
    .brand-title { font-size: 16px; font-weight: 600; color: #c4c7c5; }
    header input { flex: 1; max-width: 180px; padding: 6px 10px; border-radius: 6px; border: 1px solid #444746; background: #28292a; color: #fff; font-size: 12px; outline: none; }

    #chat-box { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 14px; }
    
    .msg { max-width: 90%; padding: 12px 16px; border-radius: 16px; line-height: 1.5; font-size: 14px; word-break: break-word; }
    .user { background: #282a2c; color: #e3e3e3; align-self: flex-end; border-bottom-right-radius: 4px; }
    .bot { background: transparent; color: #e3e3e3; align-self: flex-start; padding-left: 0; padding-right: 0; width: 100%; }
    
    /* Authentic Gemini response formatting */
    .bot p { margin-bottom: 8px; }
    .bot ul, .bot ol { margin-left: 20px; margin-bottom: 8px; }
    .bot code { background: #28292a; padding: 2px 5px; border-radius: 4px; font-family: monospace; font-size: 13px; color: #a8c7fa; }
    .bot pre { background: #1e1f20; padding: 10px; border-radius: 8px; overflow-x: auto; margin: 8px 0; border: 1px solid #2e2f31; }
    .bot pre code { background: transparent; padding: 0; color: #e3e3e3; }
    .bot h1, .bot h2, .bot h3 { margin: 10px 0 6px 0; color: #a8c7fa; }

    .system { background: transparent; color: #8e918f; font-size: 12px; text-align: center; align-self: center; }

    /* Attachment Preview Bar */
    #preview-bar { display: none; background: #1e1f20; padding: 6px 14px; border-top: 1px solid #2e2f31; align-items: center; gap: 10px; font-size: 12px; color: #a8c7fa; }
    #preview-bar button { background: none; border: none; color: #f2b8b5; font-weight: bold; cursor: pointer; margin-left: auto; }

    footer { padding: 10px 12px; background: #1e1f20; display: flex; gap: 8px; border-top: 1px solid #2e2f31; align-items: center; }
    footer textarea { flex: 1; padding: 10px 14px; border-radius: 20px; border: 1px solid #444746; background: #28292a; color: #fff; outline: none; font-size: 14px; resize: none; height: 42px; line-height: 20px; }
    
    .attach-btn { background: #28292a; border: 1px solid #444746; color: #a8c7fa; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; flex-shrink: 0; }
    .send-btn { padding: 0 16px; border-radius: 20px; border: none; background: #a8c7fa; color: #040e15; font-weight: bold; cursor: pointer; height: 40px; flex-shrink: 0; }
    .send-btn:disabled { background: #444746; color: #8e918f; }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">gemini</div>
    <input type="password" id="api-key" placeholder="API Key" onchange="saveApiKey()" />
  </header>

  <div id="chat-box">
    <div class="msg system">gemini initialized. Attach photos, files, or ask questions.</div>
  </div>

  <div id="preview-bar">
    <span id="file-name">File attached</span>
    <button onclick="clearAttachment()">Remove</button>
  </div>

  <footer>
    <label class="attach-btn" for="file-input">+</label>
    <input type="file" id="file-input" style="display: none;" accept="image/*,application/pdf,text/*" onchange="handleFileSelect(event)" />
    <textarea id="user-input" placeholder="Message gemini..." rows="1" onkeydown="handleKeyPress(event)"></textarea>
    <button class="send-btn" id="send-btn" onclick="sendMessage()">Send</button>
  </footer>

  <script>
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');
    const apiKeyInput = document.getElementById('api-key');
    const sendBtn = document.getElementById('send-btn');
    const previewBar = document.getElementById('preview-bar');
    const fileNameSpan = document.getElementById('file-name');
    
    let currentAttachment = null; // { mimeType, data (base64) }
    let conversationHistory = [];

    window.onload = () => {
      const savedKey = localStorage.getItem('gemini_api_key');
      if (savedKey) apiKeyInput.value = savedKey;
    };

    function saveApiKey() {
      localStorage.setItem('gemini_api_key', apiKeyInput.value.trim());
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const base64Data = e.target.result.split(',')[1];
        currentAttachment = {
          mimeType: file.type || "application/octet-stream",
          data: base64Data
        };
        fileNameSpan.innerText = `Attached: ${file.name}`;
        previewBar.style.display = 'flex';
      };
      reader.readAsDataURL(file);
    }

    function clearAttachment() {
      currentAttachment = null;
      document.getElementById('file-input').value = '';
      previewBar.style.display = 'none';
    }

    async function sendMessage() {
      const prompt = userInput.value.trim();
      const apiKey = apiKeyInput.value.trim();

      if (!prompt && !currentAttachment) return;
      if (!apiKey) {
        alert("Please enter your Gemini API key in the top bar.");
        return;
      }

      saveApiKey();

      // Display user message text
      let displayMsg = prompt;
      if (currentAttachment) {
        displayMsg = `[Attached File] ${prompt}`;
      }
      appendMessage(displayMsg, 'user');

      // Construct Gemini request payload parts
      let userParts = [];
      if (currentAttachment) {
        userParts.push({
          inlineData: {
            mimeType: currentAttachment.mimeType,
            data: currentAttachment.data
          }
        });
      }
      if (prompt) {
        userParts.push({ text: prompt });
      }

      // Add to conversation history
      conversationHistory.push({ role: "user", parts: userParts });

      // Clean attachment after sending to save device memory
      clearAttachment();
      userInput.value = '';
      sendBtn.disabled = true;

      // Truncate history to last 6 messages to preserve RAM on 1 GB devices
      if (conversationHistory.length > 6) {
        conversationHistory = conversationHistory.slice(-6);
      }

      const botMsgElement = appendMessage('...', 'bot');

      try {
        const response = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`,
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: conversationHistory })
          }
        );

        const data = await response.json();

        if (data.error) {
          botMsgElement.innerText = "API Error: " + data.error.message;
        } else if (data.candidates && data.candidates[0].content) {
          const botReply = data.candidates[0].content.parts[0].text;
          
          // Render Markdown response using marked.js
          botMsgElement.innerHTML = marked.parse(botReply);

          // Store response text in model history
          conversationHistory.push({ role: "model", parts: [{ text: botReply }] });
        } else {
          botMsgElement.innerText = "No response generated.";
        }
      } catch (err) {
        botMsgElement.innerText = "Network Error. Check connection or API key.";
      } finally {
        sendBtn.disabled = false;
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    }

    function appendMessage(text, type) {
      const msg = document.createElement('div');
      msg.className = `msg ${type}`;
      if (type === 'user' || type === 'system') {
        msg.innerText = text;
      } else {
        msg.innerHTML = text;
      }
      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
      return msg;
    }
  </script>
</body>
      </html>
