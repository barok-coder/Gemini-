<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gemini AI</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #131314; color: #e3e3e3; display: flex; height: 100vh; height: 100dvh; overflow: hidden; }

    /* --- Sidebar --- */
    #sidebar {
      position: fixed; top: 0; left: -280px; width: 280px; height: 100%;
      background: #1e1f20; z-index: 1000; transition: left 0.3s ease;
      display: flex; flex-direction: column; padding: 16px; border-right: 1px solid #2d2e31;
    }
    #sidebar.open { left: 0; }
    #overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.5); z-index: 999; display: none;
    }
    #overlay.active { display: block; }

    .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .new-chat-btn {
      display: flex; align-items: center; gap: 10px; background: #2b2c2e; color: #e3e3e3;
      border: none; padding: 10px 16px; border-radius: 20px; font-weight: 500; cursor: pointer; width: 100%; margin-bottom: 15px;
    }
    .history-title { font-size: 12px; color: #8e918f; font-weight: 600; margin-bottom: 10px; text-transform: uppercase; }
    .history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
    .history-item {
      padding: 10px 12px; border-radius: 8px; font-size: 14px; color: #c4c7c5;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer;
    }
    .history-item:hover { background: #2d2e31; }

    /* --- Main Layout --- */
    #app-container { flex: 1; display: flex; flex-direction: column; width: 100%; height: 100%; }

    header {
      background: #131314; padding: 12px 16px; display: flex; align-items: center; gap: 12px;
      border-bottom: 1px solid #1e1f20;
    }
    .icon-btn { background: none; border: none; color: #e3e3e3; font-size: 20px; cursor: pointer; }
    .brand-title { font-size: 16px; font-weight: 600; color: #a8c7fa; }

    /* --- Key Setup Container --- */
    #key-drawer {
      background: #1e1f20; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px;
      border-bottom: 1px solid #2d2e31; font-size: 13px;
    }
    .key-input-group { display: flex; gap: 8px; }
    .key-input-group input {
      flex: 1; padding: 8px 12px; border-radius: 8px; border: 1px solid #3d3e41;
      background: #131314; color: #fff; font-size: 13px; outline: none;
    }
    .save-btn { background: #a8c7fa; color: #040e15; border: none; padding: 0 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }

    /* --- Chat --- */
    #chat-box { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }

    .msg { max-width: 85%; padding: 12px 16px; border-radius: 18px; line-height: 1.5; font-size: 14px; word-break: break-word; }
    .user { background: #2b2c2e; color: #e3e3e3; align-self: flex-end; border-bottom-right-radius: 4px; }
    .bot { background: transparent; color: #e3e3e3; align-self: flex-start; width: 100%; max-width: 100%; padding-left: 0; }
    
    .bot p { margin-bottom: 8px; }
    .bot code { background: #1e1f20; padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 13px; color: #a8c7fa; }
    .bot pre { background: #1e1f20; padding: 12px; border-radius: 8px; overflow-x: auto; margin: 8px 0; border: 1px solid #2d2e31; }

    /* --- Footer --- */
    #preview-bar { display: none; background: #1e1f20; padding: 8px 16px; align-items: center; gap: 10px; font-size: 12px; color: #a8c7fa; }
    #preview-bar button { background: none; border: none; color: #ff6b6b; font-weight: bold; cursor: pointer; margin-left: auto; }

    footer { padding: 12px 16px; background: #131314; display: flex; gap: 8px; align-items: center; }
    .input-wrapper { flex: 1; display: flex; align-items: center; background: #1e1f20; border-radius: 24px; padding: 4px 14px; border: 1px solid #2d2e31; }
    .input-wrapper textarea { flex: 1; background: transparent; border: none; color: #fff; outline: none; font-size: 14px; resize: none; height: 36px; line-height: 20px; padding: 8px 0; }
    
    .attach-btn { color: #c4c7c5; font-size: 20px; cursor: pointer; margin-right: 8px; }
    .send-btn { background: #a8c7fa; color: #040e15; border: none; border-radius: 50%; width: 36px; height: 36px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .send-btn:disabled { background: #2b2c2e; color: #8e918f; }
  </style>
</head>
<body>

  <div id="overlay" onclick="toggleSidebar()"></div>

  <!-- Sidebar History -->
  <div id="sidebar">
    <div class="sidebar-header">
      <span style="font-weight: bold; color: #a8c7fa;">Recents</span>
      <button class="icon-btn" onclick="toggleSidebar()">✕</button>
    </div>
    <button class="new-chat-btn" onclick="clearCurrentChat()">+ New Chat</button>
    <div class="history-title">Recent Prompts</div>
    <div class="history-list" id="history-list"></div>
  </div>

  <div id="app-container">
    <header>
      <button class="icon-btn" onclick="toggleSidebar()">☰</button>
      <div class="brand-title">Gemini 2.5 Flash</div>
    </header>

    <!-- Key Container (Hidden automatically once saved) -->
    <div id="key-drawer">
      <div class="key-input-group">
        <input type="password" id="gemini-key" placeholder="Enter Gemini API Key..." />
        <button class="save-btn" onclick="saveKey()">Save</button>
      </div>
    </div>

    <div id="chat-box"></div>

    <div id="preview-bar">
      <span id="file-name">File attached</span>
      <button onclick="clearAttachment()">Remove</button>
    </div>

    <footer>
      <div class="input-wrapper">
        <label class="attach-btn" for="file-input">+</label>
        <input type="file" id="file-input" style="display: none;" accept="image/*,application/pdf,text/*" onchange="handleFileSelect(event)" />
        <textarea id="user-input" placeholder="Message Gemini..." rows="1" onkeydown="handleKeyPress(event)"></textarea>
      </div>
      <button class="send-btn" id="send-btn" onclick="sendMessage()">➤</button>
    </footer>
  </div>

  <script>
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const previewBar = document.getElementById('preview-bar');
    const fileNameSpan = document.getElementById('file-name');
    const keyDrawer = document.getElementById('key-drawer');
    const historyList = document.getElementById('history-list');
    
    let currentAttachment = null;
    let db = null;

    // --- IndexedDB Database Setup ---
    const request = indexedDB.open("GeminiChatDB", 1);
    request.onupgradeneeded = (e) => {
      db = e.target.result;
      if (!db.objectStoreNames.contains("messages")) {
        db.createObjectStore("messages", { keyPath: "id", autoIncrement: true });
      }
    };
    request.onsuccess = (e) => {
      db = e.target.result;
      loadChatHistory();
    };

    window.onload = () => {
      const gKey = localStorage.getItem('gemini_key') || '';
      document.getElementById('gemini-key').value = gKey;
      
      // Auto-remove setup container if key already exists
      if (gKey) {
        keyDrawer.style.display = 'none';
      }
    };

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('overlay').classList.toggle('active');
    }

    function saveKey() {
      const val = document.getElementById('gemini-key').value.trim();
      if (!val) {
        alert("Please enter a valid Gemini API Key.");
        return;
      }
      localStorage.setItem('gemini_key', val);
      keyDrawer.style.display = 'none'; // Auto hide once saved
    }

    function getApiKey() {
      return localStorage.getItem('gemini_key') || document.getElementById('gemini-key').value.trim();
    }

    async function saveMessageToDB(role, text) {
      if (!db) return;
      const tx = db.transaction("messages", "readwrite");
      tx.objectStore("messages").add({ role, text, timestamp: Date.now() });
      updateSidebarHistory();
    }

    async function loadChatHistory() {
      if (!db) return;
      chatBox.innerHTML = '';
      const tx = db.transaction("messages", "readonly");
      const req = tx.objectStore("messages").getAll();
      req.onsuccess = () => {
        const msgs = req.result || [];
        msgs.forEach(m => appendMessage(m.text, m.role));
        updateSidebarHistory();
      };
    }

    async function updateSidebarHistory() {
      if (!db) return;
      const tx = db.transaction("messages", "readonly");
      const req = tx.objectStore("messages").getAll();
      req.onsuccess = () => {
        const msgs = req.result || [];
        const userMsgs = msgs.filter(m => m.role === 'user').slice(-10).reverse();
        historyList.innerHTML = '';
        userMsgs.forEach(m => {
          const item = document.createElement('div');
          item.className = 'history-item';
          item.innerText = m.text;
          historyList.appendChild(item);
        });
      };
    }

    function clearCurrentChat() {
      if (!db) return;
      const tx = db.transaction("messages", "readwrite");
      tx.objectStore("messages").clear();
      chatBox.innerHTML = '';
      updateSidebarHistory();
      toggleSidebar();
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const base64Data = e.target.result.split(',')[1];
        currentAttachment = { mimeType: file.type || "application/octet-stream", data: base64Data };
        fileNameSpan.innerText = `Attached: ${file.name}`;
        previewBar.style.display = 'flex';
      };
      reader.readAsDataURL(file);
    }

    function clearAttachment() {
      currentAttachment = null;
      document.getElementById('file-input').value = '';
      previewBar.style.display = 'none';
    }

    async function sendMessage() {
      const prompt = userInput.value.trim();
      const apiKey = getApiKey();

      if (!prompt && !currentAttachment) return;

      if (!apiKey) {
        keyDrawer.style.display = 'flex';
        alert("Please set your Gemini API key first.");
        return;
      }

      appendMessage(prompt, 'user');
      await saveMessageToDB("user", prompt);

      userInput.value = '';
      clearAttachment();
      sendBtn.disabled = true;

      const botMsgElement = appendMessage('...', 'bot');

      try {
        let parts = [];
        if (currentAttachment) {
          parts.push({ inlineData: { mimeType: currentAttachment.mimeType, data: currentAttachment.data } });
        }
        if (prompt) parts.push({ text: prompt });

        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts }] })
        });

        const data = await res.json();
        if (data.error) throw new Error(data.error.message);

        const botReply = data.candidates[0].content.parts[0].text;
        botMsgElement.innerHTML = marked.parse(botReply);
        await saveMessageToDB("bot", botReply);
      } catch (err) {
        botMsgElement.innerText = "Error: " + err.message;
      } finally {
        sendBtn.disabled = false;
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    }

    function appendMessage(text, type) {
      const msg = document.createElement('div');
      msg.className = `msg ${type}`;
      if (type === 'user') {
        msg.innerText = text;
      } else {
        msg.innerHTML = marked.parse(text);
      }
      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
      return msg;
    }
  </script>
</body>
  </html>
